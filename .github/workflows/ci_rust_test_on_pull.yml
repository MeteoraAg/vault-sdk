name: CI on pull_request

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
    branches:
      - main
      - develop
      - staging

env:
  SOLANA_CLI_VERSION: 1.16.13
  ANCHOR_CLI_VERSION: 0.28.0
  TOOLCHAIN: 1.70.0

jobs:
  changed_files_rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      program: ${{steps.changed-files-specific.outputs.program}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            program:
              - "rust-client/**"
              - "programs/**"
              - "Cargo.toml"
              - "Cargo.lock"

  rust-test:
    needs: changed_files_rust
    runs-on: ubuntu-latest
    if: needs.changed_files_rust.outputs.program == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-dep
      - uses: ./.github/actions/setup-solana
      - uses: ./.github/actions/setup-anchor-cli
      # Install rust + toolchain
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy, rustfmt
      # Cargo build cache
      - name: Cargo Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/
            target
          key: ${{ runner.os }}-cargo-${{ steps.extract_branch.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.extract_branch.outputs.branch }}
            ${{ runner.os }}-cargo
      - name: Cargo fmt check
        run: cargo fmt -- --check
        shell: bash
      - name: Cargo test
        run: cargo test -- --nocapture
        shell: bash
      - name: Anchor build
        run: anchor build
      - name: Cargo build
        run: cargo build --package rust-client

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -- -D warnings
        shell: bash
