name: Continuous Integration NPM

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
    branches:
      - main
      - develop
      - staging

env:
  working_dir: ./ts-client

jobs:
  changed_files_ts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      program: ${{steps.changed-files-specific.outputs.program}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            program:
              - "ts-client/**"

  ts-test:
    needs: changed_files_ts
    runs-on: ubuntu-latest
    if: needs.changed_files_ts.outputs.program == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12
      - name: Install dependencies
        working-directory: ${{ env.working_dir }}
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: ${{ env.working_dir }}
        run: pnpm run test

  # advisories of the published dependencies, ignored ones are in ts-client/pnpm-workspace.yaml
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12
      - run: pnpm audit --prod
        working-directory: ${{ env.working_dir }}
        shell: bash

  # advisories of every dependency, dev ones included, ignored ones are in ts-client/osv-scanner.toml
  osv_scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            --config=ts-client/osv-scanner.toml
            -L
            ts-client/pnpm-lock.yaml
